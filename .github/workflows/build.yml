name: Build unified-home plugin

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      host_ref:
        description: "Amalia host branch, tag or commit (must match the installed host)"
        required: true
        default: "azim224"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # SDK export rejects builds containing application credentials.
      GROQ_API_KEY: ""
      ASSEMBLYAI_API_KEY: ""
      FISH_AUDIO_API_KEY: ""
      UNIFIED_HOME_KEY_ID: ${{ vars.UNIFIED_HOME_KEY_ID || 'unified-home-1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate persistent publisher signing key
        shell: bash
        env:
          UNIFIED_HOME_SIGNING_KEY: ${{ secrets.UNIFIED_HOME_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UNIFIED_HOME_SIGNING_KEY" ]; then
            echo "::error::Set repository secret UNIFIED_HOME_SIGNING_KEY to a persistent PEM P-256 private key (generate once locally with openssl ecparam -name prime256v1 -genkey -noout). Set repository variable UNIFIED_HOME_KEY_ID to its fixed ID (default unified-home-1). Fork PRs do not receive secrets. No random fallback is allowed."
            exit 1
          fi
          umask 077
          printf '%s\n' "$UNIFIED_HOME_SIGNING_KEY" > "$RUNNER_TEMP/unified-home-publisher.pem"
          openssl pkey -in "$RUNNER_TEMP/unified-home-publisher.pem" -check -noout > /dev/null
          openssl pkey -in "$RUNNER_TEMP/unified-home-publisher.pem" -pubout \
            -out "$RUNNER_TEMP/unified-home-publisher-public.pem"
          if ! openssl ec -pubin -in "$RUNNER_TEMP/unified-home-publisher-public.pem" \
              -text -noout 2>/dev/null | grep -Eq '^ *ASN1 OID: prime256v1$'; then
            echo "::error::UNIFIED_HOME_SIGNING_KEY must be an EC P-256 (prime256v1) private key."
            exit 1
          fi

      - name: Check host repository access
        shell: bash
        env:
          AMALIA_TOKEN: ${{ secrets.AMALIA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$AMALIA_TOKEN" ]; then
            echo "::error::Set AMALIA_TOKEN with read access to azim224/amalia-3.0. Fork PRs do not receive this secret."
            exit 1
          fi

      - name: Check out matching host SDK exporter and packaging tools
        uses: actions/checkout@v4
        with:
          repository: azim224/amalia-3.0
          ref: ${{ inputs.host_ref || 'azim224' }}
          token: ${{ secrets.AMALIA_TOKEN }}
          path: amalia-host
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install compile SDK and D8 (no obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(command -v sdkmanager || true)"
          fi
          [ -x "$SM" ] || { echo "::error::sdkmanager not found"; exit 1; }
          API="$(python3 - <<'PY'
          import pathlib
          import re
          source = pathlib.Path('amalia-host/app/build.gradle.kts').read_text()
          match = re.search(r'^\s*compileSdk\s*=\s*(\d+)\s*$', source, re.M)
          if not match:
              raise SystemExit('Cannot determine host compileSdk')
          api = int(match[1])
          # Google publishes API 37+ with an explicit minor version (37.0).
          platform = f'{api}.0' if api >= 37 else str(api)
          if api >= 37:
              source, count = re.subn(
                  r'^(\s*)compileSdk\s*=\s*\d+\s*$',
                  rf'\1compileSdk = {api}\n\1compileSdkMinor = 0',
                  source, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit('Cannot configure explicit compileSdk minor version')
              # The host exporter also constructs the platform path manually.
              old = 'platforms/android-$compileSdkApi/android.jar'
              if old not in source:
                  raise SystemExit('Host exporter platform path changed; review required')
              source = source.replace(old, 'platforms/android-$compileSdkApi.0/android.jar')
              pathlib.Path('amalia-host/app/build.gradle.kts').write_text(source)
          # Preserve stdlib built-in metadata when normalizing SDK JARs.
          exporter = pathlib.Path('amalia-host/tools/ExportNativeSdk.py')
          exporter_source = exporter.read_text()
          old = "('.class', '.kotlin_module', '.kotlin_metadata')"
          if old not in exporter_source:
              raise SystemExit('SDK JAR metadata filter changed; review required')
          exporter.write_text(exporter_source.replace(
              old, "('.class', '.kotlin_module', '.kotlin_metadata', '.kotlin_builtins')"))
          # Kotlin value-class mangling can put '-' in generated JVM class names.
          cli = pathlib.Path('amalia-host/tools/amalia_cli.py')
          cli_source = cli.read_text()
          old = r'[A-Za-z_$][A-Za-z0-9_$]*(?:/[A-Za-z_$][A-Za-z0-9_$]*)*\.class'
          new = r'[A-Za-z_$][A-Za-z0-9_$-]*(?:/[A-Za-z_$][A-Za-z0-9_$-]*)*\.class'
          if cli_source.count(old) == 1 and cli_source.count(new) == 0:
              cli.write_text(cli_source.replace(old, new))
          elif cli_source.count(old) != 0 or cli_source.count(new) != 1:
              raise SystemExit('Program JAR class-name validator changed; review required')
          print(platform)
          PY
          )"
          # Consume all input rather than yes | sdkmanager under pipefail (SIGPIPE).
          "$SM" --licenses > /dev/null <<< "$(printf 'y\n%.0s' {1..100})"
          "$SM" "platforms;android-$API" "build-tools;35.0.0"
          test -f "$SDK/platforms/android-$API/android.jar"
          test -x "$SDK/build-tools/35.0.0/d8"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Export exact-host native SDK (compile classes only, no APK)
        working-directory: amalia-host
        run: |
          chmod +x gradlew
          # The exporter resolves cross-project classpaths; configure all projects first.
          ./gradlew :app:exportNativeSdk --no-configure-on-demand --no-parallel \
            --no-daemon --console=plain --stacktrace
          git rev-parse HEAD > "$RUNNER_TEMP/host-commit.txt"
          git diff -- app/build.gradle.kts tools/ExportNativeSdk.py tools/amalia_cli.py > "$RUNNER_TEMP/host-sdk-config.patch"

      - name: Extract and verify SDK and plugin manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-sdk"
          unzip -q amalia-host/app/build/outputs/native-sdk/amalia-native-sdk.zip \
            -d "$RUNNER_TEMP/native-sdk"
          (cd "$RUNNER_TEMP/native-sdk" && sha256sum --check SHA256SUMS)
          python3 amalia-host/tools/native_plugin.py validate \
            --project "$GITHUB_WORKSPACE/android" --sdk "$RUNNER_TEMP/native-sdk"

      - name: Compile plugin JAR
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew jar --no-daemon --console=plain \
            -PamaliaNativeSdk="$RUNNER_TEMP/native-sdk"

      - name: Sign and package .amaliaplug
        shell: bash
        run: |
          set -euo pipefail
          python3 amalia-host/tools/native_plugin.py package \
            --project "$GITHUB_WORKSPACE/android" \
            --sdk "$RUNNER_TEMP/native-sdk" \
            --private-key "$RUNNER_TEMP/unified-home-publisher.pem" \
            --key-id "$UNIFIED_HOME_KEY_ID" \
            --d8 "$ANDROID_HOME/build-tools/35.0.0/d8"
          cp "$RUNNER_TEMP/unified-home-publisher-public.pem" android/dist/publisher-public.pem
          FINGERPRINT="$(openssl pkey -pubin -in android/dist/publisher-public.pem \
            -outform DER | openssl dgst -sha256 | awk '{print $NF}')"
          {
            printf 'publisher: org.amalia\nkeyId: %s\npublicKeyDerSha256: %s\n' "$UNIFIED_HOME_KEY_ID" "$FINGERPRINT"
            printf '%s\n' \
              'Pin publisher-public.pem for publisher org.amalia with the exact keyId above; verify its public DER SHA-256 fingerprint.' \
              'Save this public key under the exact publisher and keyId above (replace a stale pin if necessary), then fully stop the Amalia host process and reopen it before importing the matching .amaliaplug.' \
              'Review android.native and the platform.json digest before activation.' \
              'An existing ci-ephemeral package requires the public key from that exact build, not this new persistent key.' \
              'Kotlin DEX class names containing hyphens require an updated host loader; repackaging the plugin alone cannot fix an old host.'
          } > android/dist/publisher-info.txt
          cp "$RUNNER_TEMP/host-commit.txt" android/dist/host-commit.txt
          cp "$RUNNER_TEMP/host-sdk-config.patch" android/dist/host-sdk-config.patch
          ls -lh android/dist/

      - name: Remove temporary private signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/unified-home-publisher.pem"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-home-plugin
          path: |
            android/dist/*.amaliaplug
            android/dist/publisher-public.pem
            android/dist/publisher-info.txt
            android/dist/host-commit.txt
            android/dist/host-sdk-config.patch
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unified-home-plugin
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.amaliaplug
            dist/publisher-public.pem
            dist/publisher-info.txt
            dist/host-commit.txt
            dist/host-sdk-config.patch
